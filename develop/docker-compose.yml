volumes:
  pnpm_cache:
  node_modules:

services:
  personal-site:
    build:
      context: ../
      dockerfile: develop/Dockerfile
    container_name: personal-site
    working_dir: /app
    volumes:
      - ../:/app
      - node_modules:/app/node_modules
      - pnpm_cache:/app/.pnpm-store
    network_mode: host
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
      - WATCHPACK_POLLING=true
