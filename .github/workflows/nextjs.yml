name: Deploy Branch Previews to GitHub Pages

on:
  push:
    branches:
      - base-updates-new-design
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "gh-pages-preview-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
            echo "command=install --no-frozen-lockfile" >> $GITHUB_OUTPUT
            echo "runner=pnpm" >> $GITHUB_OUTPUT
            echo "build_runner=pnpm" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            echo "build_runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npm" >> $GITHUB_OUTPUT
            echo "build_runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Install pnpm
        if: steps.detect-package-manager.outputs.manager == 'pnpm'
        run: npm install -g pnpm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.runner }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Build static preview
        env:
          NEXT_PUBLIC_IS_PAGES_PREVIEW: "true"
          NEXT_PUBLIC_DISABLE_SEO: "true"
          NEXT_PUBLIC_PAGES_REPOSITORY: ${{ github.event.repository.name }}
          NEXT_PUBLIC_PAGES_BRANCH_PATH: ${{ github.ref_name }}
        run: ${{ steps.detect-package-manager.outputs.build_runner }} next build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Deploy preview to gh-pages branch folder
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./out
          destination_dir: ${{ github.ref_name }}
          keep_files: true
          force_orphan: false
          enable_jekyll: false
